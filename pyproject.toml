[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpd-etl"
version = "0.1.0"
description = "PySpark ETL for the Health Canada Drug Product Database"
requires-python = ">=3.10,<3.13"
dependencies = ["pyspark>=3.5,<4", "duckdb>=1.0,<3", "datadog>=0.56,<1"]

[project.optional-dependencies]
delta = ["delta-spark==3.3.2"]
bigquery = ["google-cloud-bigquery>=3.27,<4"]
mongo = ["pymongo>=4.10,<5"]
dev = ["pytest>=8", "ruff>=0.5", "pyyaml>=6,<7"]
azure = ["azure-functions==1.26.0", "azure-storage-blob==12.31.1"]
gcp = ["google-cloud-storage>=2.18,<4", "flask>=3,<4", "gunicorn>=23,<24"]
airflow = ["apache-airflow==3.3.2"]
cloud-test = ["google-cloud-batch>=0.17,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.package-data]
dpd_etl = ["sql/*.sql"]
