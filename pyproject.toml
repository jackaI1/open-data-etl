[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dpd-etl"
version = "0.1.0"
description = "PySpark ETL for the Health Canada Drug Product Database"
requires-python = ">=3.10,<3.13"
dependencies = ["pyspark>=3.5,<4", "duckdb>=1.0,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
