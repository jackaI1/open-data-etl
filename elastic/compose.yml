# Local review only. Security is disabled; both ports bind to loopback.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: 'false'
      xpack.ml.enabled: 'false'
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - '127.0.0.1:${ES_PORT:-19200}:9200'
    mem_limit: 1536m
    volumes:
      - catalogue:/usr/share/elasticsearch/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow']
      interval: 5s
      timeout: 5s
      retries: 60
  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.6
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      TELEMETRY_ENABLED: 'false'
      XPACK_SECURITY_ENABLED: 'false'
      NODE_OPTIONS: --max-old-space-size=768
    ports:
      - '127.0.0.1:${KIBANA_PORT:-15601}:5601'
    mem_limit: 1536m
    volumes:
      - ./kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:5601/api/status > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 60
volumes:
  catalogue:
