services:
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    environment:
      # Public emulator-only signing key, never an Azure account credential.
      AZURITE_ACCOUNTS: dpdlocal:ZHBkLWxvY2FsLWVtdWxhdG9yLW9ubHkta2V5LTAwMDE=
    ports:
      - "127.0.0.1:11000:10000"
      - "127.0.0.1:11001:10001"
      - "127.0.0.1:11002:10002"
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').connect(10000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 2s
      timeout: 3s
      retries: 30
  functions:
    build:
      context: ..
      dockerfile: azure_summary/Dockerfile
    depends_on:
      azurite:
        condition: service_healthy
    environment:
      FUNCTIONS_WORKER_RUNTIME: python
      AzureWebJobsStorage: DefaultEndpointsProtocol=http;AccountName=dpdlocal;AccountKey=ZHBkLWxvY2FsLWVtdWxhdG9yLW9ubHkta2V5LTAwMDE=;BlobEndpoint=http://azurite:10000/dpdlocal;QueueEndpoint=http://azurite:10001/dpdlocal;TableEndpoint=http://azurite:10002/dpdlocal;
      DPD_SUMMARY_SCHEDULE: ${DPD_SUMMARY_SCHEDULE:-0 0 8 * * *}
      DPD_DATA_DIR: /data
      DPD_SNAPSHOT_DATE: ${DPD_SNAPSHOT_DATE:-}
    volumes:
      - ../data/fixture:/data:ro
