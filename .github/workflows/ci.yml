name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev]'
      - run: make lint test fixture evaluate PYTHON=python SNAPSHOT_DATE=2026-11-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-quality-report
          path: |
            data/fixture/reports/
            data/reports/detection_evaluation.json
