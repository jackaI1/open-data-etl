name: CI
on:
  push:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  delta:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev,delta]'
      - name: Test real Delta transactions and execute the parameterized notebook
        run: make delta-test delta-fixture PYTHON=python SNAPSHOT_DATE=2026-11-01
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: delta-quality-report
          path: data/fixture/reports/
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev,gcp,cloud-test,bigquery,azure]'
      - run: make lint fixture evaluate monitor-demo PYTHON=python SNAPSHOT_DATE=2026-11-01
      - name: Test all features and SQL against the pinned BigQuery emulator
        run: PYTHON=python scripts/test_bigquery.sh --junitxml=data/reports/bigquery-tests.xml
      - name: Render a deployment without credentials
        run: PROJECT_ID=sample-project BUCKET=sample-dpd-data RUN_ID=sample FIXTURE=true PYTHON=python scripts/deploy_gcp.sh render
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-quality-report
          path: |
            data/fixture/reports/
            data/reports/detection_evaluation.json
            data/reports/monitoring-demo.json
            data/reports/bigquery-tests.xml
            data/gcp/job.json
  gcp-config:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - run: terraform -chdir=infra/gcp fmt -check
      - run: terraform -chdir=infra/gcp init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=infra/gcp validate
      - run: terraform -chdir=infra/gcp test
      - run: bash -n scripts/deploy_gcp.sh
      - run: docker build --target report -t dpd-report:test .
      - name: Run real Spark sample inside the Batch image
        run: >-
          docker run --rm --entrypoint python
          -v "$PWD/tests/fixtures/raw:/fixtures:ro" dpd-report:test
          -m dpd_etl transform --fixture --raw-dir /fixtures
          --data-dir /tmp/output --snapshot-date 2026-11-01
      - name: Check report HTTP server inside the container
        run: >-
          docker run --rm --entrypoint python
          -v "$PWD/scripts/smoke_report.py:/tmp/smoke_report.py:ro"
          dpd-report:test /tmp/smoke_report.py

  airflow:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the pinned Airflow runtime with official constraints
        run: >-
          python -m pip install 'apache-airflow==3.3.2'
          --constraint https://raw.githubusercontent.com/apache/airflow/constraints-3.3.2/constraints-3.12.txt
      - run: python -m pip install -e '.[dev,airflow]'
      - name: Import DAG and run real task instances, reruns and backfills
        run: make airflow-test PYTHON=python

  elastic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
      ELASTIC_SAMPLE_DIR: data/fixture
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[dev]'
      - run: make fixture PYTHON=python SNAPSHOT_DATE=2026-11-01
      - name: Real bulk ingestion, atomic reruns, searches and Kibana import/export
        run: PYTHON=python scripts/test_elastic.sh --junitxml=data/reports/elastic-tests.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: elastic-tests
          path: data/reports/elastic-tests.xml

  superset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --no-deps -e .
      - run: pip install duckdb pyyaml requests pytest playwright==1.56.0
      - run: python -m playwright install --with-deps chromium
      - name: Validate exported columns and metric SQL
        run: python -m pytest -q tests/test_dashboard.py -k 'not real_pipeline'
      - name: Import, query and export in pinned Superset
        run: PYTHON=python scripts/test_superset.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: superset-validation
          path: |
            data/superset/roundtrip.zip
            data/superset/validated.txt
            data/superset/dashboard.png

  azure-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
      DPD_SNAPSHOT_DATE: '2026-11-01'
      DPD_SUMMARY_SCHEDULE: '*/5 * * * * *'
      AZURITE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=dpdlocal;AccountKey=ZHBkLWxvY2FsLWVtdWxhdG9yLW9ubHkta2V5LTAwMDE=;BlobEndpoint=http://127.0.0.1:11000/dpdlocal;QueueEndpoint=http://127.0.0.1:11001/dpdlocal;TableEndpoint=http://127.0.0.1:11002/dpdlocal;
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pip install -e '.[dev,azure]'
      - run: make fixture PYTHON=python SNAPSHOT_DATE=2026-11-01
      - name: Run Functions SDK harness and Azurite integration
        run: |
          docker compose -p dpd-azure-test -f azure_summary/compose.yml up -d --wait azurite
          python -m pytest -q tests/azure
      - name: Run the real scheduled Functions host
        run: |
          docker compose -p dpd-azure-test -f azure_summary/compose.yml up -d --build functions
          python scripts/check_azure_host.py
      - name: Stop owned services on success or failure
        if: always()
        run: |
          docker compose -p dpd-azure-test -f azure_summary/compose.yml logs --tail 60
          docker compose -p dpd-azure-test -f azure_summary/compose.yml down --volumes --remove-orphans
